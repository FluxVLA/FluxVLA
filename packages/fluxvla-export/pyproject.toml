[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fluxvla-export"
version = "0.1.0"
description = "Minimal FluxVLA model frontend for FluxHermes builds"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
  {name = "FluxVLA Contributors"},
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  # Preserve the existing Torch 2.6 training environments; test 2.6 and 2.8.
  "torch>=2.6,<2.9",
  "transformers==5.3.0",
  "safetensors>=0.6.2,<0.7",
  # safetensors.torch imports packaging but does not declare it in its core.
  "packaging>=23.2",
]

[project.optional-dependencies]
# safetensors 0.6.2 uses NumPy to serialize test tensors.
test = ["numpy>=1.26,<3"]
# Verified public ONNX exporter profile. Newer IR/protobuf combinations change
# function inlining/serialization; native inference still supports Torch 2.6.
test-onnx = [
  "torch==2.8.0",
  "numpy==1.26.4",
  "onnx==1.18.0",
  "onnxscript==0.3.2",
  "onnx-ir==0.1.7",
  "protobuf==5.29.5",
  "onnxruntime==1.23.2",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fluxvla_export = ["py.typed"]
