name: Unit tests

on:
  pull_request:
    branches: [master, main]
  push:
    branches: [master, main]
  workflow_dispatch:
    inputs:
      run_gpu:
        description: Require the full CUDA suite (needs a configured GPU runner)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: unit-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  cpu-unit-tests:
    name: CPU model unit tests (deterministic)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CUDA_VISIBLE_DEVICES: ''
      PYTHONNOUSERSITE: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: |
            requirements-test.txt
            test/requirements-cpu.txt

      - name: Install CPU-only test dependencies
        run: |
          # Fetch only the CPU wheels here; resolve all dependencies against the
          # pinned test requirements below, without temporarily installing NumPy 2.
          python -m pip install --no-deps torch==2.8.0 torchvision==0.23.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r test/requirements-cpu.txt
          python -m pip check

      - name: Check and record the CPU runtime
        run: |
          report_dir="$RUNNER_TEMP/fluxvla-cpu-test-reports"
          mkdir -p "$report_dir"
          echo "REPORT_DIR=$report_dir" >> "$GITHUB_ENV"
          python - <<'PY'
          import sys

          import torch
          import torchvision
          import transformers
          from mmengine.config.utils import _is_builtin_module

          if torch.__version__.split('+')[0] != '2.8.0':
              raise SystemExit('The CPU job requires PyTorch 2.8.0.')
          if torch.version.cuda is not None or torch.cuda.is_available():
              raise SystemExit('This job must use CPU-only PyTorch, without CUDA.')
          if transformers.__version__ != '5.3.0':
              raise SystemExit('The CPU job requires Transformers 5.3.0.')
          if not all(_is_builtin_module(name) for name in ('os', 'copy')):
              raise SystemExit('MMEngine must recognize the Python standard library.')
          print('Python:', sys.version)
          print('PyTorch:', torch.__version__)
          print('Torchvision:', torchvision.__version__)
          print('Transformers:', transformers.__version__)
          PY
          python -m pip freeze > "$report_dir/environment.txt"
          git rev-parse HEAD > "$report_dir/commit.txt"

      - name: Run real CPU model and config tests with independent seeds and orders
        id: pytest
        # Test-only import isolation avoids eager RADIO/CUDA initialization.
        # The selected units execute actual FluxVLA modules, not fake models.
        run: |
          status=0
          for seed in 0 17 2026; do
            PYTHONHASHSEED="$seed" python -m pytest --cpu-model-tests @test/cpu-tests.txt -q -ra \
              --test-order-seed="$seed" \
              --junitxml="$REPORT_DIR/junit-$seed.xml" \
              2>&1 | tee "$REPORT_DIR/pytest-$seed.log" || status=1
          done
          exit "$status"

      - name: Reject missing reports, skipped tests, or inconsistent coverage
        if: always() && (steps.pytest.outcome == 'success' || steps.pytest.outcome == 'failure')
        run: |
          python - <<'PY'
          import os
          import xml.etree.ElementTree as ET
          from collections import Counter
          from pathlib import Path

          # A green CPU job must include real model computation, not just configs.
          required_models = {
              'test_tiny_llm_forward_backward_and_causal_mask': 3,
              'test_tiny_llm_kv_cache_matches_full_sequence': 3,
              'test_tiny_siglip_multiview_forward_backward': 2,
              'test_tiny_paligemma_multiview_forward_backward': 2,
              'test_tiny_openvla_forward_backward_and_predict_action': 1,
              'test_tiny_llava_flow_matching_forward_backward_and_predict_action': 1,
              'test_tiny_pi_forward_backward': 2,
              'test_tiny_pi_predict_action': 2,
              'test_projector_forward_backward_and_reload': 3,
              'test_tiny_dit4dit_head_loss_backward_and_predict': 2,
              'test_tiny_llava_action_head_masked_loss_backward_and_predict': 2,
              'test_tiny_flow_head_seeded_inference_and_prefix': 2,
          }
          report_dir = Path(os.environ['REPORT_DIR'])
          expected = None
          for seed in (0, 17, 2026):
              path = report_dir / f'junit-{seed}.xml'
              cases = ET.parse(path).getroot().findall('.//testcase')
              if not cases:
                  raise SystemExit(f'No tests executed: {path}')
              problems = [case.attrib for case in cases
                          if any(case.find(tag) is not None
                                 for tag in ('skipped', 'failure', 'error'))]
              if problems:
                  raise SystemExit(f'Non-passing unit tests in {path}: {problems}')
              counts = Counter(case.get('name', '').split('[')[0] for case in cases)
              missing = {name: count - counts[name]
                         for name, count in required_models.items() if counts[name] < count}
              if missing:
                  raise SystemExit(f'Required model coverage missing in {path}: {missing}')
              identities = sorted((case.get('classname'), case.get('name'))
                                  for case in cases)
              if expected is not None and identities != expected:
                  raise SystemExit(f'The selected unit tests changed with seed {seed}.')
              expected = identities
              message = (f'Seed {seed}: {len(cases)} passed, no skips; '
                         f'all {sum(required_models.values())} required real model cases ran.')
              print(message)
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
                  summary.write(message + '\n\n')
          PY

      - name: Upload CPU model test logs and JUnit reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cpu-unit-test-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/fluxvla-cpu-test-reports/
          if-no-files-found: warn
          retention-days: 7

  runner-config:
    name: Check GPU runner configuration
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      enabled: ${{ steps.runner.outputs.enabled }}
      labels: ${{ steps.runner.outputs.labels }}
    steps:
      - name: Select GPU coverage from the explicit runner configuration
        id: runner
        env:
          RUNNER_LABELS: ${{ vars.FLUXVLA_UNIT_TEST_RUNNER_LABELS }}
          REQUIRE_GPU: ${{ inputs.run_gpu && 'true' || 'false' }}
        run: |
          python3 - <<'PY'
          import json
          import os

          raw = os.environ.get('RUNNER_LABELS', '').strip()
          if not raw:
              if os.environ.get('REQUIRE_GPU') == 'true':
                  raise SystemExit(
                      'CUDA tests were requested, but FLUXVLA_UNIT_TEST_RUNNER_LABELS '
                      'is not configured. Set a JSON list of isolated GPU runner '
                      'labels after configuring PR approval; see test/README.md.')
              message = (
                  'CUDA integration tests NOT RUN: FLUXVLA_UNIT_TEST_RUNNER_LABELS is not '
                  'configured. Real CPU model and config unit tests run automatically '
                  'with test-only import isolation. '
                  'Configure an isolated GPU runner to enable the full default '
                  'unit suite; see test/README.md.')
              print('::notice::' + message)
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
                  summary.write('## Unit test coverage\n\n' + message + '\n')
              with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
                  output.write('enabled=false\n')
              raise SystemExit(0)
          try:
              labels = json.loads(raw)
          except json.JSONDecodeError as error:
              raise SystemExit('FLUXVLA_UNIT_TEST_RUNNER_LABELS is not valid JSON.') from error
          if (not isinstance(labels, list) or not labels
                  or any(not isinstance(label, str) or not label.strip()
                         for label in labels)):
              raise SystemExit('Runner labels must be a nonempty JSON list of strings.')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write('enabled=true\n')
              output.write('labels=' + json.dumps(labels) + '\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
              summary.write(
                  '## Unit test coverage\n\nCPU model/config units and the full default '
                  'CUDA unit suite are enabled. Check each job for its actual result. '
                  'Full-size checkpoint regressions remain opt-in.\n')
          PY

  unit-tests:
    name: Unit tests (CUDA, deterministic)
    needs: runner-config
    if: needs.runner-config.outputs.enabled == 'true'
    runs-on: ${{ fromJSON(needs.runner-config.outputs.labels || '["ubuntu-latest"]') }}
    # Configure required reviewers before enabling the runner variable above.
    # Never attach this workflow to a persistent training/development machine.
    environment: unit-tests-gpu
    timeout-minutes: 30
    env:
      BASE_PYTHON: ${{ vars.FLUXVLA_UNIT_TEST_PYTHON || 'python3' }}
      PYTHONNOUSERSITE: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      CUBLAS_WORKSPACE_CONFIG: ':4096:8'
      TOKENIZERS_PARALLELISM: 'false'
      WANDB_MODE: disabled
      MAX_JOBS: '2'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Check the pre-provisioned CUDA runtime
        run: |
          report_dir="$RUNNER_TEMP/fluxvla-unit-test-reports"
          mkdir -p "$report_dir"
          echo "REPORT_DIR=$report_dir" >> "$GITHUB_ENV"
          "$BASE_PYTHON" - <<'PY'
          import sys

          import flash_attn
          import torch
          import transformers
          from mmengine.config.utils import _is_builtin_module

          if sys.version_info[:2] != (3, 10):
              raise SystemExit('The unit-test runner must provide Python 3.10.')
          if torch.__version__.split('+')[0] != '2.8.0' or torch.version.cuda != '12.8':
              raise SystemExit('The validated CI runtime is PyTorch 2.8.0 with CUDA 12.8.')
          if transformers.__version__ != '5.3.0':
              raise SystemExit('The unit-test runner must provide Transformers 5.3.0.')
          if not torch.cuda.is_available():
              raise SystemExit('CUDA is required; do not skip the model tests in CI.')
          if torch.cuda.get_device_capability()[0] < 8 or not torch.cuda.is_bf16_supported():
              raise SystemExit('The model tests require an Ampere-or-newer BF16 GPU.')
          if not all(_is_builtin_module(name) for name in ('os', 'copy')):
              raise SystemExit(
                  'MMEngine cannot recognize this interpreter standard library. '
                  'Use a self-contained Python/Conda runtime, not an inherited venv.')
          print('Python:', sys.version)
          print('PyTorch:', torch.__version__, 'CUDA:', torch.version.cuda)
          print('Transformers:', transformers.__version__)
          print('FlashAttention:', flash_attn.__version__)
          print('GPU:', torch.cuda.get_device_name())
          PY
          "$BASE_PYTHON" -c 'import os, sys; print(os.path.dirname(sys.executable))' >> "$GITHUB_PATH"

      - name: Install test dependencies and build this checkout's extensions
        run: |
          "$BASE_PYTHON" -m pip install -r requirements-test.txt
          "$BASE_PYTHON" -m pip install --no-build-isolation --no-deps -e .
          "$BASE_PYTHON" -m pip freeze > "$REPORT_DIR/environment.txt"
          git rev-parse HEAD > "$REPORT_DIR/commit.txt"

      - name: Run all default unit tests with independent seeds and orders
        id: pytest
        run: |
          status=0
          for seed in 0 17 2026; do
            PYTHONHASHSEED="$seed" "$BASE_PYTHON" -m pytest -q -ra \
              --test-order-seed="$seed" \
              --junitxml="$REPORT_DIR/junit-$seed.xml" \
              2>&1 | tee "$REPORT_DIR/pytest-$seed.log" || status=1
          done
          exit "$status"

      - name: Reject missing reports, skipped tests, or inconsistent coverage
        if: always() && (steps.pytest.outcome == 'success' || steps.pytest.outcome == 'failure')
        run: |
          "$BASE_PYTHON" - <<'PY'
          import os
          import xml.etree.ElementTree as ET
          from pathlib import Path

          report_dir = Path(os.environ['REPORT_DIR'])
          expected = None
          for seed in (0, 17, 2026):
              path = report_dir / f'junit-{seed}.xml'
              cases = ET.parse(path).getroot().findall('.//testcase')
              if not cases:
                  raise SystemExit(f'No tests executed: {path}')
              problems = [case.attrib for case in cases
                          if any(case.find(tag) is not None
                                 for tag in ('skipped', 'failure', 'error'))]
              if problems:
                  raise SystemExit(f'Non-passing unit tests in {path}: {problems}')
              identities = sorted((case.get('classname'), case.get('name'))
                                  for case in cases)
              if expected is not None and identities != expected:
                  raise SystemExit(f'The selected unit tests changed with seed {seed}.')
              expected = identities
              print(f'Seed {seed}: {len(cases)} passed, no skips.')
          PY

      - name: Upload test logs and JUnit reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: unit-test-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/fluxvla-unit-test-reports/
          if-no-files-found: warn
          retention-days: 7
