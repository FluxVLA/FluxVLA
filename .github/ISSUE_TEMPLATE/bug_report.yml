name: Bug report
description: Report a reproducible FluxVLA installation, data, model, or runtime issue
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve FluxVLA. Search the [existing issues](https://github.com/FluxVLA/FluxVLA/issues) and check the [installation and usage guide](https://github.com/FluxVLA/FluxVLA/blob/main/README.md) before reporting a problem.

        Do not include API keys, tokens, passwords, private datasets, or unredacted environment files. For security concerns or conduct reports, contact the maintainers privately using the addresses in the [contribution guide](https://github.com/FluxVLA/FluxVLA/blob/main/docs/CONTRIBUTING.md#contact).

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I have searched for existing reports of this issue.
          required: true
        - label: I have removed credentials and private information from this report.
          required: true

  - type: textarea
    id: description
    attributes:
      label: Bug description
      description: Describe the problem and its impact on your workflow.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Affected component
      multiple: true
      options:
        - Installation or dependencies
        - Dataset, transforms, or collator
        - Model, backbone, or action head
        - Training, checkpoint loading, or resume
        - Simulation evaluation
        - Real-robot inference or RTC
        - Remote serving or API-backed inference
        - Documentation
        - Other (describe above)
    validations:
      required: true

  - type: input
    id: model
    attributes:
      label: Model and checkpoint
      description: Include the model family and checkpoint identifier/revision, if relevant. Do not upload private weights.
      placeholder: PI0.5, GR00T N1.7, DiT4DiT, FastWAM, or not applicable
    validations:
      required: false

  - type: dropdown
    id: platform
    attributes:
      label: Benchmark or robot platform
      description: Select the relevant platforms. Installation and documentation issues need not involve a robot.
      multiple: true
      options:
        - LIBERO
        - RoboCasa GR1
        - FluxBiSim / AlohaSim
        - ALOHA
        - UR3
        - Franka single-arm or dual-arm
        - Tron2
        - Oli whole-body
        - Custom or other (describe in reproduction steps)
        - Not applicable
    validations:
      required: false

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include the FluxVLA commit and relevant runtime versions. Use not applicable for fields unrelated to the issue.
      placeholder: |
        FluxVLA commit (git rev-parse HEAD):
        OS and architecture:
        Python version:
        GPU model and NVIDIA driver (if used):
        PyTorch version and torch.version.cuda:
        CUDA toolkit version (if used):
        Transformers / FlashAttention / video decoder versions (if relevant):
        Installation command, mode, and CUDA profile:
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps and configuration
      description: Provide minimal commands, config paths and overrides, dataset version, and seed. For documentation issues, identify the file and section instead.
      placeholder: |
        1. Config path and overrides:
        2. Dataset identifier/version and task or episode selection:
        3. Exact command, worker/GPU count, and seed:
        4. Steps that trigger the problem:
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead? Include relevant output shapes, metrics, or failure symptoms.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or traceback
      description: Paste the relevant output after removing credentials and private information.
      render: text
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Include a last known working commit, attempted workarounds, or non-sensitive screenshots if useful.
    validations:
      required: false
