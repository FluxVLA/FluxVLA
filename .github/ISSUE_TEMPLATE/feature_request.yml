name: ✨ Feature Request
description: Suggest an idea or enhancement for FluxVLA
title: "[Feature]: "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a new feature for FluxVLA!
        
        Before submitting, please check if the feature has already been requested in the [existing issues](https://github.com/FluxVLA/FluxVLA/issues).

  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: A clear and concise description of what the problem is.
      placeholder: e.g., I'm always frustrated when...
    validations:
      required: false

  - type: textarea
    id: solution
    attributes:
      label: Describe the solution you'd like
      description: A clear and concise description of what you want to happen.
      placeholder: Describe your proposed solution...
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Describe alternatives you've considered
      description: A clear and concise description of any alternative solutions or features you've considered.
      placeholder: List any alternative solutions you've considered...
    validations:
      required: false

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: How important is this feature to you?
      options:
        - Low (nice to have)
        - Medium (would improve my workflow)
        - High (blocking my work)
        - Critical (project cannot proceed without this)
    validations:
      required: true

  - type: dropdown
    id: robot
    attributes:
      label: Related Robot Model
      description: Which robot model is this feature related to?
      options:
        - All robots
        - Unitree Go1
        - Unitree Go2
        - Duow
        - Go2W
        - M20
        - G1 (29 DoF)
        - New robot support
    validations:
      required: false

  - type: textarea
    id: use_case
    attributes:
      label: Use Case
      description: Describe a specific use case where this feature would be helpful.
      placeholder: Describe your use case...
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Add any other context, screenshots, or references about the feature request here.
      placeholder: Any additional information...
    validations:
      required: false
