[pytest]
minversion = 7.0
testpaths = test
python_files = test_*.py
pythonpath = .
addopts = --strict-config --strict-markers --import-mode=importlib
norecursedirs = .git .venv __pycache__ build dist src checkpoints datasets work_dirs data third_party_models
markers =
    checkpoint: full-size model/checkpoint numerical regression; run with --run-checkpoint-tests
