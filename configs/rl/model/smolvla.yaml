# @package actor.model
model_type: fluxvla_smolvla
model_path: ???
precision: fp32
load_to_device: true
is_lora: false
lora_rank: 32
num_action_chunks: ${simulator.action_chunk}
action_dim: ${simulator.action_dim}
num_steps: ${simulator.num_steps}
use_proprio: true
add_value_head: true
joint_logprob: false
experiment_tag: fluxvla_smolvla
fsdp_wrap_policy:
  # SmolVLA invokes text/expert layers through submodules, so they remain in
  # the root FSDP2 shard. Only the vision encoder layer is wrapped directly.
  transformer_layer_cls_to_wrap: [SmolVLMEncoderLayer]
  module_classes_to_wrap: [LinearProjector, ValueHead]
fluxvla:
  config_path: ${oc.env:FLUXVLA_ROOT}/configs/smolvla/smolvla_libero_10_finetune.py
  tokenizer_path: ${simulator.tokenizer_path}
  norm_stats_path: ${simulator.norm_stats_path}
  compute_dtype: bf16
  train_expert_only: true
  noise_method: flow_sde
  noise_level: ${simulator.noise_level}
  observation_adapter: ${simulator.adapter}
  action_horizon: 50
  rollout_micro_batch_size: ${actor.micro_batch_size}
  model_overrides: ${simulator.model_overrides}
