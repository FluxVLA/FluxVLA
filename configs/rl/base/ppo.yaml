# @package _global_

defaults:
  - /hybrid_engines/fsdp@actor.fsdp_config
  - /weight_syncer/bucket_syncer@weight_syncer
  - override /hydra/job_logging: stdout
  - _self_

hydra:
  run:
    dir: .
  job:
    chdir: false
  output_subdir: null

cluster:
  num_nodes: 1
  component_placement:
    actor,env,rollout: all

runner:
  task_type: embodied
  logger:
    log_path: ${oc.env:FLUXVLA_ROOT}/work_dirs/rlinf
    project_name: fluxvla_rl
    logger_backends: [tensorboard]
  max_epochs: 1000
  max_steps: 1000
  weight_sync_interval: 1
  only_eval: false
  val_check_interval: -1
  save_interval: 50
  resume_dir: null
  ckpt_path: null

algorithm:
  normalize_advantages: true
  kl_penalty: kl
  group_size: 1
  reward_coef: 1.0
  reward_type: chunk_level
  logprob_type: chunk_level
  entropy_type: token_level
  update_epoch: 4
  adv_type: gae
  loss_type: actor_critic
  loss_agg_func: token-mean
  kl_beta: 0.0
  entropy_bonus: 0.0
  clip_ratio_high: 0.2
  clip_ratio_low: 0.2
  clip_ratio_c: 3.0
  value_clip: 0.2
  huber_delta: 10.0
  gamma: 0.99
  gae_lambda: 0.95
  filter_rewards: false
  rewards_lower_bound: 0.1
  rewards_upper_bound: 0.9

env:
  group_name: EnvGroup
  enable_offload: false
  train:
    rollout_epoch: 1
    total_num_envs: 16
    reward_coef: ${algorithm.reward_coef}
    video_cfg:
      save_video: false
  eval:
    rollout_epoch: 1
    total_num_envs: 16
    auto_reset: true
    ignore_terminations: true
    is_eval: true
    group_size: 1
    video_cfg:
      save_video: false
      video_base_dir: ${runner.logger.log_path}/video/eval

rollout:
  group_name: RolloutGroup
  generation_backend: huggingface
  recompute_logprobs: false
  enable_offload: true
  pipeline_stage_num: 1
  enable_torch_compile: false
  enable_cuda_graph: false
  model:
    model_path: ${actor.model.model_path}
    precision: fp32

actor:
  group_name: ActorGroup
  training_backend: fsdp
  micro_batch_size: 2
  global_batch_size: 32
  seed: 42
  enable_offload: true
  enable_sft_co_train: false
  optim:
    lr: 1.0e-6
    value_lr: 1.0e-4
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-8
    weight_decay: 0.01
    clip_grad: 1.0
    critic_warmup_steps: 0
    total_training_steps: ${runner.max_steps}
    min_lr_rate: 1.0
    lr_scheduler: constant
  fsdp_config:
    # FSDP1 unconditionally casts root inputs, corrupting stored FP32 chains.
    strategy: fsdp2
    sharding_strategy: full_shard
    use_orig_params: true
    gradient_checkpointing: false
    mixed_precision:
      # Autocast inside the policy supplies BF16 matmul/conv compute. Keep
      # gathered parameters FP32 too, matching rollout's embeddings/norms.
      param_dtype: fp32
      reduce_dtype: fp32
      buffer_dtype: fp32
      cast_forward_inputs: false
    amp_autocast:
      enabled: false

reward:
  use_reward_model: false
critic:
  use_critic_model: false
